repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff
        name: Lint with Ruff
        args: ["--fix"]
      - id: ruff-format
        name: Format with Ruff

  - repo: local
    hooks:
      - id: auto-stage
        name: Auto-stage ruff fixes
        entry: git add -u
        language: system
        always_run: true
        pass_filenames: false
